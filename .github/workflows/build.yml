name: Build Rise Hub APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rise-hub-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g\ -Dfile.encoding=UTF-8\ -XX:+HeapDumpOnOutOfMemoryError

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Show Build Environment
        run: |
          java -version
          gradle --version

      - name: Build Debug APK
        id: build_debug
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --max-workers=2 \
            --console=plain 2>&1 | tee build-debug.log

      - name: Show Debug Errors
        if: always()
        run: |
          if [ -f build-debug.log ]; then
            {
              echo '### Debug build errors'
              echo '```'
              grep -nE '^e: |^error: |Execution failed for task|What went wrong|Caused by:|Could not |Unresolved reference|Duplicate class|OutOfMemory' build-debug.log | head -40 || true
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            grep -E '^e: |Execution failed for task' build-debug.log | head -20 | while read -r line; do echo "::error::$line"; done || true
          fi

      - name: Upload Debug Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RiseHub-debug-build-log
          path: build-debug.log
          if-no-files-found: warn

      - name: Fail if Debug Build Failed
        if: steps.build_debug.outcome == 'failure'
        run: exit 1

      - name: Verify Debug APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RiseHub-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-release:
    name: Build Signed Release APK + AAB
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    timeout-minutes: 20
    needs: build-debug
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.RISE_HUB_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RISE_HUB_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RISE_HUB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RISE_HUB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing RISE_HUB_KEYSTORE_B64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing RISE_HUB_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing RISE_HUB_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing RISE_HUB_KEY_PASSWORD"; exit 1; }

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RISE_HUB_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > rise-hub-release.jks
          chmod 600 rise-hub-release.jks

      - name: Build signed Release APK and Play Store AAB
        id: build_release
        continue-on-error: true
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/rise-hub-release.jks
          STORE_PASSWORD: ${{ secrets.RISE_HUB_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RISE_HUB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RISE_HUB_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease :app:bundleRelease \
            --no-daemon \
            --no-configuration-cache \
            --max-workers=2 \
            --console=plain 2>&1 | tee build-release.log

      - name: Show Release Errors
        if: always()
        run: |
          if [ -f build-release.log ]; then
            {
              echo '### Release build errors'
              echo '```'
              grep -nE '^e: |^error: |Execution failed for task|What went wrong|Caused by:|Could not |Unresolved reference|Duplicate class|OutOfMemory' build-release.log | head -40 || true
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            grep -E '^e: |Execution failed for task' build-release.log | head -20 | while read -r line; do echo "::error::$line"; done || true
          fi

      - name: Upload Release Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RiseHub-release-build-log
          path: build-release.log
          if-no-files-found: warn

      - name: Fail if Release Build Failed
        if: steps.build_release.outcome == 'failure'
        run: exit 1

      - name: Upload signed Release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RiseHub-signed-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Delete keystore from runner
        if: always()
        run: rm -f rise-hub-release.jks
