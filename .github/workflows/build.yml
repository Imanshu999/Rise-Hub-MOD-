name: Build Rise Hub APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rise-hub-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify Gradle project files
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/libs.versions.toml

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --no-configuration-cache --max-workers=2 --stacktrace --console=plain 2>&1 | tee build-debug.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RiseHub-debug-build-log
          path: build-debug.log
          if-no-files-found: warn

      - name: Verify APK
        if: success()
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RiseHub-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
